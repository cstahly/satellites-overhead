server {
    listen 80;
    listen [::]:80;
    server_name sdr.sadbabyrabbit.com;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        auth_basic off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sdr.sadbabyrabbit.com;

    ssl_certificate     /etc/nginx/ssl/sdr.sadbabyrabbit.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sdr.sadbabyrabbit.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    auth_basic "SDR control";
    auth_basic_user_file /etc/nginx/sdr.htpasswd;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:18723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
