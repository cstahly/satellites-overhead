# Temporary HTTP-only configuration used to issue the initial TLS certificate.
# Replace this file with the rendered nginx-sdr.conf.template after TLS works.

server {
    listen 80;
    listen [::]:80;
    server_name sdr.sadbabyrabbit.com;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        auth_basic off;
    }

    auth_basic "SDR control";
    auth_basic_user_file /etc/nginx/sdr.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:18723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Remote-User $remote_user;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
